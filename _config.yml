# The games under */play/ are synced static builds (see CLAUDE.md) — bare app
# shells with no description or canonical. Keep them out of the sitemap so they
# can't cannibalise the real landing pages in search.
defaults:
  - scope:
      path: "clone-defense/play"
    values:
      sitemap: false
  - scope:
      path: "red-five/play"
    values:
      sitemap: false

# Character pages (and their index) are generated by starwars-timeline's
# build_scripts/website.js and must never be hand-edited, so their permalink
# lives here. Without it Jekyll emits /character/<slug>.html and makes that the
# canonical, while Netlify also serves the extensionless form with a 200 —
# Google indexed the extensionless URL and filed the .html one as "Duplicate,
# Google chose different canonical than user" across all ~79 pages (GSC,
# 2026-09-08). netlify.toml holds a 301 per character page from the old .html
# URL; regenerate that block when the character set changes.
  - scope:
      path: "character"
      type: "pages"
    values:
      permalink: /character/:basename/
  # ...except the generated index, which must stay at /character/, not
  # /character/index/. Longer scope path wins in Jekyll's defaults resolution.
  - scope:
      path: "character/index.md"
      type: "pages"
    values:
      permalink: /character/

# /admin/ is the Netlify CMS login shell — an app shell with no indexable
# content. Keep it out of the sitemap (it still serves normally).
  - scope:
      path: "admin"
    values:
      sitemap: false
