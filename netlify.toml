[build]
  command = "bundle exec jekyll build"
  publish = "_site"

[dev]
  command = "bundle exec jekyll serve --livereload"
  port = 4000
  publish = "_site"

[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin/"
  status = 301

# The top-level static pages moved from /page.html to /page/ (2026-08-10). Both
# forms used to serve 200, so Google indexed the .html URL while every internal
# link pointed at the extensionless one — Search Console filed the linked URLs as
# "Alternate page with proper canonical tag". These 301s hand the old indexed
# URLs to the new canonical. Keep them; they are the only path from the old URLs.
[[redirects]]
  from = "/about.html"
  to = "/about/"
  status = 301

[[redirects]]
  from = "/building-a-death-star.html"
  to = "/building-a-death-star/"
  status = 301

[[redirects]]
  from = "/hyper-panels.html"
  to = "/hyper-panels/"
  status = 301

[[redirects]]
  from = "/posts.html"
  to = "/posts/"
  status = 301

[[redirects]]
  from = "/star-wars-timeline.html"
  to = "/star-wars-timeline/"
  status = 301

[[redirects]]
  from = "/support-aurebesh-files.html"
  to = "/support-aurebesh-files/"
  status = 301

[[redirects]]
  from = "/swordle-star-wars-wordle.html"
  to = "/swordle-star-wars-wordle/"
  status = 301

[[redirects]]
  from = "/swordle-word-list.html"
  to = "/swordle-word-list/"
  status = 301

[[redirects]]
  from = "/the-original-swordle.html"
  to = "/the-original-swordle/"
  status = 301

# Character pages moved from /character/<slug>.html to /character/<slug>/
# (2026-09-08) via a permalink front-matter default in _config.yml. Same story as
# the top-level pages above: both forms served 200, so Google indexed the
# extensionless URL and filed the .html one as "Duplicate, Google chose different
# canonical than user" across all ~79 pages. These 301s hand the already-indexed
# .html URLs to the new canonical, so they must not be dropped.
#
# These are listed one by one on purpose. A splat rule (/character/*.html) does
# NOT work: Netlify only supports a splat at the END of a path, so a rule with a
# suffix after the * never matches anything (verified against Netlify's own
# netlify-redirector matcher). The full-segment forms (/character/:name or
# /character/*) do match, but they also swallow the new trailing-slash URLs and
# rewrite /character/foo.html to /character/foo.html/ — wrong target and a
# self-referential rule. Explicit rules are the only correct option.
#
# The character set is generated by starwars-timeline's build_scripts/website.js.
# When characters are added or removed, regenerate this block from _site/sitemap.xml.

