[build]
  command = "bundle exec jekyll build"
  publish = "_site"

[dev]
  command = "bundle exec jekyll serve --livereload"
  port = 4000
  publish = "_site"

[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin/"
  status = 301

[build.environment]
  JEKYLL_ENV = "production"

# The satellite apps (wordle./timeline./hyperpanels.starwars.guide) fetch the
# centralized news feed cross-origin.
[[headers]]
  for = "/news-feed.json"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=300" 