<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<!-- No-cache: iOS Safari caches ES modules hard, and dev/serve.mjs sends no-store to match. -->
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="theme-color" content="#05070c">
<!-- Follows the hub's title convention: '<page> | Star Wars Guide' (see _includes/head.html
     there). The wordmark alone means nothing to someone who has never seen the game, so the
     tab, the search result and the share card all carry what it actually is. -->
<title>RED FIVE — Endless Death Star Trench Run | Star Wars Guide</title>
<meta name="description" content="Fly the Death Star trench in an X-Wing. One tap climbs, gravity does the rest. Dodge the turrets, duel Vader, chase your best score. Free, no sign-up.">

<!-- Social sharing. Absolute URLs only — every crawler resolves these against its own host,
     never against this page, so a relative path silently yields no preview at all.
     The image is social.png, not hero.png: same marquee art, but padded to 2:1 by
     dev/make-social.mjs so no platform's crop can clip the wordmark. Re-run `npm run social`
     if the hero art ever changes.
     og:url points at the LANDING page, not this one: /red-five/play/ is deliberately kept out
     of the sitemap so it cannot cannibalise /red-five/ in search, and a share that resolves to
     the indexable page keeps that split intact.
     The social title drops the ' | Star Wars Guide' suffix the page title carries — every
     platform already prints og:site_name beside the headline, so repeating it there just
     spends characters before the truncation point. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Star Wars Guide">
<meta property="og:title" content="RED FIVE — Endless Death Star Trench Run">
<meta property="og:description" content="One X-Wing, one tap, and a trench that never ends. Dodge the towers, survive the turrets, duel Vader. Free, no sign-up, phone or desktop.">
<meta property="og:url" content="https://starwars.guide/red-five/">
<meta property="og:image" content="https://starwars.guide/red-five/play/src/assets/social.png">
<meta property="og:image:width" content="1320">
<meta property="og:image:height" content="660">
<meta property="og:image:alt" content="RED FIVE — pixel-art wordmark with an X-Wing and the Death Star">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="RED FIVE — Endless Death Star Trench Run">
<meta name="twitter:description" content="One X-Wing, one tap, and a trench that never ends. Dodge the towers, survive the turrets, duel Vader. Free, no sign-up, phone or desktop.">
<meta name="twitter:image" content="https://starwars.guide/red-five/play/src/assets/social.png">
<meta name="twitter:image:alt" content="RED FIVE — pixel-art wordmark with an X-Wing and the Death Star">

<link rel="stylesheet" href="styles.css">

<div class="device" id="device">

  <!-- Topbar: lives, score, best. Built once; only text and classes change. -->
  <header class="topbar" id="topbar">
    <div class="lives" id="lives" aria-label="Lives"></div>
    <div class="score" id="score">0</div>
    <div class="best" id="best">BEST 0</div>
  </header>

  <!-- Scanner strip (Defender radar): upcoming towers, pickups, Vader warning. -->
  <canvas class="scanner" id="scanner" aria-hidden="true"></canvas>

  <!-- Play area: renderer owns #field-canvas; all pointer input lands on #fieldwrap. -->
  <div id="fieldwrap">
    <canvas id="field-canvas"></canvas>

    <!-- Buff chips, created once and toggled. -->
    <div class="buffs" id="buffs" aria-hidden="true"></div>

    <!-- Countdown overlay: not a .screen, it must not dim the field. -->
    <div class="countdown" id="countdown" aria-hidden="true">
      <div class="cd-label">START TAPPING IN</div>
      <div class="cd-n" id="cd-n">3</div>
    </div>

    <!-- Bonus-round control prompt. The trench is tap-only and the bonus round is
         drag-to-steer, so the new verb has to be taught before the run starts. -->
    <div class="prompt" id="bonus-prompt" aria-hidden="true">
      <div class="prompt-box">
        <div class="prompt-title">DRAG TO STEER</div>
        <div class="prompt-hand" aria-hidden="true">&#9678;</div>
      </div>
    </div>

    <!-- Vader duel callouts. -->
    <div class="callout warn" id="vader-warn" aria-hidden="true">DARTH VADER APPROACHES</div>
    <div class="callout yahoo" id="yahoo" aria-hidden="true">YA&#8209;HOO!</div>
    <div class="callout evaded" id="vader-evaded" aria-hidden="true">VADER EVADED &middot; +150</div>

    <!-- Bonus-round score readout. -->
    <!-- One wrapping span: as direct flex children these become anonymous flex items and
         the whitespace between them is stripped, rendering "6RINGS". -->
    <div class="bonus-hud" id="bonus-hud" aria-hidden="true">
      <span><span id="bonus-rings">0</span> RINGS &middot; <span id="bonus-points">0</span></span>
    </div>

    <!-- Arcade cabinet: marquee / bezelled screen / control deck. The three bands are a
         flex column, marquee and deck locked to the same height so the screen is centered. -->
    <section class="screen show cabinet" id="screen-title">
      <div class="marquee" id="marquee"></div>

      <!-- Transparent on purpose: the live approach scene (Death Star, X-Wing) is the
           canvas behind, and this band is the glass it shows through. -->
      <div class="cab-screen">
        <div class="cab-glass">
          <h1 class="logo">RED FIVE</h1>
          <p class="sub">standing by&hellip;</p>

          <!-- House board with the player merged in, rebuilt by ui/screens.js whenever
               the title screen is shown. The rule lives in src/meta/board.js. -->
          <ol class="board" id="board"></ol>

          <p class="score-line" id="title-best"></p>
          <p class="runs-line" id="title-runs"></p>

          <!-- Revealed once a score exists: sharing should not require dying first. -->
          <button class="btn ghost btn-share-title" id="btn-share-title" type="button" hidden>SHARE</button>

          <!-- Build tag. CI sed-stamps src/version.js per deploy, so this is how a player
               reporting a bug tells you which build they were on. Empty until JS fills it:
               a stale hardcoded placeholder would be worse than no version at all. -->
          <span class="app-version" id="app-version"></span>
        </div>
      </div>

      <!-- The whole deck IS the button: the art carries the call to action. -->
      <button class="deck" id="btn-begin" type="button" aria-label="Begin approach"></button>
    </section>

    <section class="screen" id="screen-over">
      <h2>YOU LOST</h2>
      <div class="final" id="final-score">0</div>
      <p class="dim" id="final-detail"></p>
      <p class="newbest" id="newbest" hidden>NEW BEST</p>

      <!-- Arcade initials. Shown every run, prefilled with what is stored, so it doubles
           as the way to change them — there is no other screen that owns this. -->
      <label class="initials" for="initials-in">ENTER INITIALS
        <input id="initials-in" class="initials-in" type="text" maxlength="3"
               inputmode="latin" autocapitalize="characters" autocomplete="off"
               spellcheck="false" placeholder="AAA" aria-label="Your three-letter initials">
      </label>

      <button class="btn primary" id="btn-again" type="button">TRY AGAIN</button>
      <button class="btn ghost" id="btn-share" type="button">SHARE SCORE</button>
      <button class="btn ghost" id="btn-title" type="button">BACK TO START</button>
    </section>

    <section class="screen" id="screen-pause">
      <h2>PAUSED</h2>
      <button class="btn primary" id="btn-resume" type="button">RESUME</button>
    </section>
  </div>
</div>

<!-- Third-party loaders. These three tags are the ONE sanctioned exception to "zero
     dependencies": there is no bundler, and dev/build.mjs rejects a bare `import` outright,
     so a CDN tag is the only way in. Every snippet does nothing but create a queue stub and
     inject the library — the config-driven init() lives in src/telemetry/{rum,ga}.js and
     src/ui/ads.js, reading globals.rum/.ga/.ads.
     They sit here rather than in <head> because none blocks first paint and the game's
     own module is what actually starts a session. -->
<script>
  (function(h,o,u,n,d){h=h[d]=h[d]||{q:[],onReady:function(c){h.q.push(c)}}
  d=o.createElement(u);d.async=1;d.src=n;n=o.getElementsByTagName(u)[0];n.parentNode.insertBefore(d,n)})
  (window,document,'script','https://www.datadoghq-browser-agent.com/us1/v6/datadog-rum.js','DD_RUM')
</script>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-JYWS72F9R1"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag() { dataLayer.push(arguments); }
</script>
<!-- AdSense. No <ins> here on purpose: the unit is built by src/ui/ads.js, which skips
     AdSense entirely on a dev host and draws a white placeholder box instead. -->
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6056590143595280" crossorigin="anonymous"></script>

<script type="module" src="src/main.js"></script>
